name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  norminette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install norminette
        run: pip install norminette==3.3.60
      - name: Run norminette
        run: norminette src libft

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (mandatory + bonus)
        run: make all bonus
      - name: Run tests
        run: ./tests/run_tests.sh
      - name: Rebuild from scratch
        run: make fclean && make re && make bonus
